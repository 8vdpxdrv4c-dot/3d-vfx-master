<!doctype html><meta charset="utf-8"><title>大师技能 · mobile and accessible controls</title><style>body{background:#0b1520;color:#cdd;font:14px Arial}iframe{width:390px;height:844px;border:0}pre{white-space:pre-wrap}</style><h1>390 × 844 移动端布局与控件验收</h1><button id="run">开始验证</button><p id="status">Ready</p><section id="stage"></section><pre id="report"></pre>
<script type="module">
const $=s=>document.querySelector(s),wait=t=>new Promise(r=>setTimeout(r,t));
$('#run').onclick=async()=>{const rows=[];$('#run').disabled=true;try{const catalog=await(await fetch('../effect-catalog.json')).json();const targets=catalog.map(m=>({name:m.slug,url:'../../assets/modules/'+m.slug+'/demos/'}));targets.push({name:'aurora-rain',url:'../../assets/recipes/aurora-rain/'},{name:'glass-bloom',url:'../../assets/recipes/glass-bloom/'});
for(const target of targets){$('#status').textContent=target.name;const frame=document.createElement('iframe');frame.src=target.url+'?still&low';$('#stage').replaceChildren(frame);await new Promise((resolve,reject)=>{frame.onload=resolve;setTimeout(()=>reject(Error('load timeout')),20000);});const d=frame.contentDocument;for(let i=0;i<160&&d.querySelector('#status')?.dataset.state!=='ready';i++)await wait(75);
 const row={name:target.name,ready:d.querySelector('#status')?.dataset.state==='ready',width:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,canvasCount:d.querySelectorAll('canvas').length};
 row.noOverflow=row.scrollWidth<=row.width;const controls=[...d.querySelectorAll('#gui input,#gui select')],names=controls.map(x=>d.getElementById(x.getAttribute('aria-labelledby'))?.textContent||x.getAttribute('aria-label')||'');row.namedControls=names.every(Boolean);row.uniqueNames=new Set(names).size===names.length;row.controlCount=controls.length;
 const nums=[...d.querySelectorAll('[role=spinbutton]')];row.numericCount=nums.length;row.numericBounds=nums.every(x=>Number(x.getAttribute('aria-valuemin'))<=Number(x.value)&&Number(x.value)<=Number(x.getAttribute('aria-valuemax'))&&Number(x.getAttribute('aria-valuenow'))===Number(x.value));
 row.looks=[];for(const button of d.querySelectorAll('[data-look]')){const before=Number(d.querySelector('canvas').dataset.draws||0);button.click();await wait(70);row.looks.push({id:button.dataset.look,selected:button.getAttribute('aria-pressed')==='true',redrawn:Number(d.querySelector('canvas').dataset.draws||0)>before});}
 row.pass=row.ready&&row.noOverflow&&row.canvasCount===1&&row.namedControls&&row.uniqueNames&&row.numericBounds&&row.looks.every(x=>x.selected&&x.redrawn);rows.push(row);$('#report').textContent=JSON.stringify({rows},null,2);
}$('#status').textContent=rows.filter(r=>r.pass).length+'/'+rows.length+' passed';$('#status').dataset.state='done';$('#report').textContent=JSON.stringify({viewport:[390,844],pass:rows.every(r=>r.pass),rows,scope:'Iframe layout and browser WebGL; not a physical phone GPU benchmark.'},null,2);}catch(e){$('#status').textContent=e.stack;$('#status').dataset.state='error';}finally{$('#run').disabled=false;}};
</script>
