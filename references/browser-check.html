<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>大师技能入口布局检查</title><style>body{background:#0b131b;color:#b6cdd5;font:13px Arial;padding:25px}button{padding:12px}iframe{display:block;width:390px;height:844px;border:1px solid #758b8e;margin-top:20px}pre{white-space:pre-wrap}</style><h1>390×844 统一技能入口检查</h1><button id="run">检查手机入口</button><p id="status">Ready</p><pre id="report"></pre><iframe title="手机入口" src="../index.html"></iframe><script type="module">
const $=s=>document.querySelector(s);$('#run').onclick=async()=>{let result;try{const frame=$('iframe');for(let i=0;i<100;i++){if(frame.contentDocument.querySelector('#status')?.dataset.state==='ready')break;await new Promise(r=>setTimeout(r,50));}const expected=(await(await fetch('./effect-catalog.json')).json()).length;const doc=frame.contentDocument;result={viewport:[390,844],title:doc.querySelector('h1').textContent,count:Number(doc.querySelector('#count').textContent),cards:doc.querySelectorAll('.card').length,noHorizontalOverflow:doc.documentElement.scrollWidth<=390,unifiedEntry:doc.querySelector('[href="./SKILL.md"]')?.textContent};result.pass=result.title==='3Dfans特效大师'&&result.count===expected&&result.cards===expected&&result.noHorizontalOverflow&&!!result.unifiedEntry;}catch(error){result={pass:false,error:String(error)};}$('#report').textContent=JSON.stringify(result,null,2);$('#status').dataset.state='done';$('#status').textContent=result.pass?'Passed':'Failed';};
</script></html>
