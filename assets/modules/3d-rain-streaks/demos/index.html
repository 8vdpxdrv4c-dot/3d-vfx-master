<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3Dfans特效大师 · 雨丝与水花（用户代码离线版）</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0d12; color: #e8e4da;
               font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #hud { position: fixed; left: 16px; top: 16px; padding: 10px 14px;
         background: rgba(11,13,15,.8); border-left: 2px solid #ffb347;
         font: 12px/1.7 ui-monospace, monospace; letter-spacing: .04em;
         pointer-events: none; min-width: 160px; }
  #hud b { color: #ffb347; font-weight: 700; }
  #hud .row { display: flex; justify-content: space-between; gap: 20px; }

  #hint { position: fixed; left: 16px; bottom: 16px; padding: 8px 12px;
          background: rgba(11,13,15,.72); font: 12px/1.6 "PingFang SC", sans-serif;
          letter-spacing: .06em; color: rgba(232,228,218,.72); pointer-events: none; }
  #hint kbd { display: inline-block; padding: 1px 7px; margin: 0 3px;
              border: 1px solid rgba(232,228,218,.4); font-family: ui-monospace, monospace;
              font-size: 11px; color: #e8e4da; }

  #controls { position: fixed; right: 16px; top: 16px; display: flex; flex-direction: column;
              gap: 10px; min-width: 250px; }
  .ctrl { background: rgba(11,13,15,.86); border: 1px solid rgba(232,228,218,.18); padding: 12px 14px; }
  .ctrl label { display: flex; justify-content: space-between; font: 600 11px/1 "PingFang SC", sans-serif;
                letter-spacing: .18em; color: rgba(232,228,218,.7); margin-bottom: 8px;
                text-transform: uppercase; }
  .ctrl label .val { color: #ffb347; letter-spacing: .04em; font-family: ui-monospace, monospace; }
  .ctrl input[type=range] { width: 100%; height: 22px; -webkit-appearance: none; appearance: none;
                            background: transparent; cursor: pointer; margin: 0; }
  .ctrl input[type=range]::-webkit-slider-runnable-track { height: 2px; background: rgba(232,228,218,.3); }
  .ctrl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 20px;
                                                   margin-top: -9px; background: #ffb347; border: 0; border-radius: 0; }
  .ctrl input[type=range]::-moz-range-track { height: 2px; background: rgba(232,228,218,.3); }
  .ctrl input[type=range]::-moz-range-thumb { width: 12px; height: 20px; background: #ffb347; border: 0; border-radius: 0; }
  .ctrl select { width: 100%; font: 12px/1.4 "PingFang SC", sans-serif; letter-spacing: .04em; }

  #controls button { background: rgba(11,13,15,.86); color: #e8e4da;
                     border: 1px solid rgba(232,228,218,.4); padding: 10px 15px;
                     font: 600 12px/1 "PingFang SC", sans-serif; letter-spacing: .16em;
                     cursor: pointer; transition: background .12s, color .12s, border-color .12s; }
  #controls button:hover { background: #ffb347; color: #0b0d0f; border-color: #ffb347; }
  #controls button.on { background: #ffb347; color: #0b0d0f; border-color: #ffb347; }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div class="row"><span>雨滴</span><b id="s-rain">0</b></div>
  <div class="row"><span>水花</span><b id="s-splash">0</b></div>
  <div class="row"><span>FPS</span><b id="s-fps">0</b></div>
</div>

<div id="hint">
  <kbd>拖拽</kbd> 旋转 · <kbd>滚轮</kbd> 缩放 · <kbd>空格</kbd> 暂停
</div>

<div id="controls">
  <div class="ctrl">
    <label>预设 <span class="val" id="v-look">夜雨</span></label>
    <select id="i-look"></select>
  </div>
  <div class="ctrl">
    <label>雨量 <span class="val" id="v-rain">60%</span></label>
    <input type="range" id="i-rain" min="0" max="100" value="60">
  </div>
  <div class="ctrl">
    <label>雨点大小 <span class="val" id="v-size">1.00×</span></label>
    <input type="range" id="i-size" min="30" max="250" value="100">
  </div>
  <div class="ctrl">
    <label>风速 <span class="val" id="v-wind">3.0</span></label>
    <input type="range" id="i-wind" min="0" max="100" value="50">
  </div>
  <button id="btn-pause">暂停</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createRainStreaksEffect, createRainStage } from './effects/rain-streaks.js';
import { meta } from './meta.js';

window.__rainErrors = [];
window.addEventListener('error', (event) => window.__rainErrors.push(String(event.message || event)));
window.addEventListener('unhandledrejection', (event) => window.__rainErrors.push(String(event.reason)));

const app = document.getElementById('app');

/* 原页 renderer 配置；r160 下显式关闭 legacy lights 以贴近 r180 的物理光照 */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if ('useLegacyLights' in renderer) renderer.useLegacyLights = false;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e14);
scene.fog = new THREE.FogExp2(0x0a0e14, 0.018);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 3.5, 8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.update();

/* 演示布景与雨系统分离：正式接入项目时只保留雨系统 */
const stage = createRainStage();
scene.add(stage.group);

const defaults = Object.fromEntries(meta.schema.map((s) => [s.key, s.default]));
const params = { ...defaults, ...meta.looks[0].params };
const effect = createRainStreaksEffect({ renderer, camera, scene, params });
effect.setStage(stage);

/* ============================================================
 * 控制器：window.__rainDemo.params 是唯一状态源
 * ============================================================ */
let currentLook = meta.looks[0].id;
const iLook = document.getElementById('i-look');
const vLook = document.getElementById('v-look');
const iRain = document.getElementById('i-rain');
const vRain = document.getElementById('v-rain');
const iSize = document.getElementById('i-size');
const vSize = document.getElementById('v-size');
const iWind = document.getElementById('i-wind');
const vWind = document.getElementById('v-wind');
const btnPause = document.getElementById('btn-pause');
const elRain = document.getElementById('s-rain');
const elSplash = document.getElementById('s-splash');
const elFps = document.getElementById('s-fps');

for (const look of meta.looks) {
  const option = document.createElement('option');
  option.value = look.id;
  option.textContent = look.title;
  iLook.append(option);
}

let paused = false;
let lastSpeed = params.speed;

function syncControls() {
  iRain.value = String(Math.round(params.rain * 100));
  vRain.textContent = Math.round(params.rain * 100) + '%';
  iSize.value = String(Math.round(params.dropSize * 100));
  vSize.textContent = params.dropSize.toFixed(2) + '×';
  iWind.value = String(Math.round(params.windSpeed / 8 * 100));
  vWind.textContent = params.windSpeed.toFixed(1);
  iLook.value = currentLook;
  const look = meta.looks.find((l) => l.id === currentLook);
  vLook.textContent = look ? look.title.replace(/（.*?）/g, '') : currentLook;
  btnPause.classList.toggle('on', paused);
  btnPause.textContent = paused ? '继续' : '暂停';
}

function selectLook(id) {
  const look = meta.looks.find((l) => l.id === id) || meta.looks[0];
  currentLook = look.id;
  Object.assign(params, defaults, look.params);
  paused = false;
  lastSpeed = Math.max(params.speed, 0.05);
  syncControls();
}

iLook.addEventListener('change', () => selectLook(iLook.value));
iRain.addEventListener('input', () => {
  const v = +iRain.value / 100;
  params.rain = v;
  vRain.textContent = Math.round(v * 100) + '%';
});
iSize.addEventListener('input', () => {
  const v = +iSize.value / 100;
  params.dropSize = Math.max(0.3, Math.min(2.5, v));
  vSize.textContent = params.dropSize.toFixed(2) + '×';
});
iWind.addEventListener('input', () => {
  params.windSpeed = +iWind.value / 100 * 8;
  vWind.textContent = params.windSpeed.toFixed(1);
});

function togglePause() {
  paused = !paused;
  if (paused) {
    lastSpeed = params.speed || 1;
    params.speed = 0;
  } else {
    params.speed = lastSpeed;
  }
  syncControls();
}
btnPause.addEventListener('click', togglePause);
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    togglePause();
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  effect.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
 * 主循环
 * ============================================================ */
const clock = new THREE.Clock();
let frames = 0;
let fpsAccum = 0, fpsFrames = 0, fpsValue = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  effect.update(dt, params);
  controls.update();
  renderer.render(scene, camera);
  frames++;

  fpsAccum += dt;
  fpsFrames++;
  if (fpsAccum >= 0.5) {
    fpsValue = fpsFrames / fpsAccum;
    fpsAccum = 0;
    fpsFrames = 0;
  }
  elRain.textContent = effect.counts.rain;
  elSplash.textContent = effect.counts.splash;
  elFps.textContent = fpsValue.toFixed(0);
  window.__rainReady = true;
}

syncControls();
animate();

window.__rainDemo = {
  effect, renderer, scene, camera, controls, stage, params, meta,
  get frames() { return frames; },
  get look() { return currentLook; },
  preset: selectLook,
  pause: togglePause,
  /** 固定时间相位并停止推进，便于生成可复现截图。 */
  freeze: (t = 12.34) => { params.speed = 0; paused = true; effect.setTime(t); effect.settle(params); syncControls(); },
  dispose: () => { effect.dispose(); stage.dispose(); }
};
</script>

<link rel="stylesheet" href="../../../shared/demo-chrome.css">
<script type="module" src="../../../shared/demo-chrome.js"></script>
</body>
</html>
