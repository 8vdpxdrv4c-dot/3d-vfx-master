<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>方体与流水 · 手机布局检查</title><style>body{background:#0a1118;color:#cbdadf;font:12px Arial;margin:20px}iframe{width:390px;height:844px;border:1px solid #38505a;border-radius:8px}pre{white-space:pre-wrap}h1{font-size:17px}</style><h1>390 × 844 手机尺寸与低功耗检查</h1><p id="status">Running</p><iframe title="手机预览" src="../demos/?low&still"></iframe><pre id="report"></pre><script type="module">
const $=s=>document.querySelector(s),frame=$('iframe'),wait=t=>new Promise(r=>setTimeout(r,t));
try{await new Promise(r=>frame.onload=r);const d=frame.contentDocument;for(let i=0;i<150&&d.querySelector('#status')?.dataset.state!=='ready';i++)await wait(80);
const report={viewport:[390,844],contentWidth:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,ready:d.querySelector('#status').dataset.state==='ready',quality:d.querySelector('#quality').textContent,looks:[]};report.noOverflow=report.scrollWidth<=report.contentWidth;
for(const [key,value]of [['steady',1],['full',1.45],['gentle',.35]]){d.querySelector('[data-look='+key+']').click();await wait(80);const control=d.querySelector('#param-flow');report.looks.push({id:key,selected:d.querySelector('[data-look='+key+']').getAttribute('aria-pressed')==='true',value:Number(control.value),display:d.querySelector('#value-flow').textContent,synchronized:Number(control.value)===value&&d.querySelector('#value-flow').textContent===value.toFixed(2)+' ×'});}
const input=d.querySelector('#param-flow');input.value='0';input.dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true}));report.zeroFlow=d.querySelector('canvas').dataset.stream==='false'&&d.querySelector('canvas').dataset.drops==='0';
d.querySelector('[data-look=steady]').click();await wait(150);report.paused=d.querySelector('#pause').getAttribute('aria-pressed')==='true';report.canvasWidth=d.querySelector('canvas').getBoundingClientRect().width;report.drops=Number(d.querySelector('canvas').dataset.drops);report.pass=report.ready&&report.noOverflow&&report.quality.includes('低功耗')&&report.looks.every(r=>r.selected&&r.synchronized)&&report.zeroFlow&&report.paused&&report.drops>0&&report.drops<=100;report.scope='Browser iframe layout and low-power branch; not a physical phone benchmark.';$('#report').textContent=JSON.stringify(report,null,2);$('#status').textContent=report.pass?'全部通过':'存在未通过项';$('#status').dataset.state=report.pass?'passed':'failed';}catch(e){$('#status').textContent=e.stack;$('#status').dataset.state='failed';}
</script></html>
